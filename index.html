<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>翻翻卡</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #d9d2cc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      color: #4b4b4b;
    }

    .game-container {
      width: 100%;
      max-width: 400px;
      background-color: #e7e2dc;
      border-radius: 32px;
      padding: 24px 18px 30px;
      box-shadow: none;
    }

    /* 积分栏 */
    .score-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #d6d2cb;
      border-radius: 60px;
      padding: 10px 22px;
      margin-bottom: 22px;
      border: 1px solid #ccc6be;
      box-shadow: none;
    }

    .score-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .score-label {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #6e6a64;
    }

    .high-score {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #b08d7a;
    }

    .high-score span {
      font-size: 1rem;
      line-height: 1;
    }

    .score-value {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.8rem;
      font-weight: 500;
      color: #6b8c7c;
      transition: transform 0.2s ease;
    }

    .score-value span {
      font-size: 1.9rem;
      line-height: 1;
    }

    /* 档位选择区 */
    .tier-section {
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .tier-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* 档位按钮 */
    .tier-btn {
      background: #f3efea;
      border: 1px solid #d2cac1;
      border-radius: 26px;
      padding: 14px 0;
      font-size: 1.2rem;
      font-weight: 500;
      color: #5a5a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.15s;
      cursor: pointer;
      box-shadow: none;
    }

    .tier-btn:active {
      transform: scale(0.96);
      background-color: #e6dfd7;
    }

    .tier-btn.selected {
      background-color: #c7d3cc;
      border-color: #a8b9b0;
      color: #2f4b3e;
      box-shadow: none;
    }

    .tier-btn .emoji {
      font-size: 1.3rem;
    }

    /* 彩蛋按钮 */
    .egg-btn {
      grid-column: 1 / -1;
      background: #e8ddd6;
      border: 1px solid #d2c1b8;
      border-radius: 26px;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 500;
      color: #8a7a70;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.15s;
      cursor: pointer;
      box-shadow: none;
      margin-top: 4px;
    }

    .egg-btn:active {
      transform: scale(0.96);
      background-color: #dfd2ca;
    }

    /* 游戏区域 */
    .board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
    }

    /* 卡片 */
    .card {
      aspect-ratio: 1 / 1;
      background-color: #cfc9c0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      color: #fff5e6;
      border: 1px solid #bfb8af;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      user-select: none;
      box-shadow: none;
      background-image: none;
      padding: 4px;
      line-height: 1;
      overflow: hidden;
    }

    .card.flipped {
      background-color: #b7c9be;
      border: 1px solid #9db3a6;
      color: #3e4e46;
      box-shadow: none;
      background-image: none;
    }

    .card.matched {
      background-color: #cfd9d1;
      color: #7f8f84;
      border: 1px solid #bcc9c0;
      opacity: 0.8;
      pointer-events: none;
      box-shadow: none;
    }

    .card .number {
      font-size: 1.7rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .card .points {
      font-size: 0.72rem;
      font-weight: 500;
      color: #587067;
      opacity: 0.9;
      line-height: 1;
      margin-top: 2px;
      letter-spacing: 0.2px;
    }

    .card.matched .points {
      color: #7f8f84;
      opacity: 0.7;
    }

    .card .card-img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      display: block;
    }

    .card .img-points {
      font-size: 0.72rem;
      font-weight: 500;
      color: #587067;
      opacity: 0.9;
      line-height: 1;
      margin-top: 1px;
      letter-spacing: 0.2px;
    }

    .card.matched .img-points {
      color: #7f8f84;
      opacity: 0.7;
    }

    /* 游戏结束信息 */
    .game-over-message {
      text-align: center;
      font-size: 1rem;
      color: #9d8e82;
      padding: 10px 0 4px;
      letter-spacing: 0.5px;
      min-height: 40px;
    }

    /* 提示文字 */
    .hint-text {
      text-align: center;
      font-size: 0.9rem;
      color: #9d8e82;
      padding: 12px 0 4px;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    /* 收集栏 - 仅在开始界面显示，无文字 */
    .collection-section {
      margin-top: 18px;
      padding: 0 4px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .collection-slot {
      aspect-ratio: 1 / 1;
      background-color: #ddd8d2;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #c2bbb3;
      overflow: hidden;
      padding: 4px;
    }

    .collection-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .collection-slot.unlocked img {
      display: block;
    }

    /* 隐藏类 */
    .hidden {
      display: none !important;
    }

    /* 游戏结束弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(80, 75, 70, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.hidden {
      display: none !important;
    }

    .modal-box {
      background-color: #e7e2dc;
      border-radius: 28px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #d2cac1;
      box-shadow: none;
    }

    /* 弹窗内数字/图案展示 - 三个并排 */
    .modal-number-display {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .modal-number-display .num-text {
      font-size: 2.4rem;
      font-weight: 600;
      color: #3e4e46;
    }

    .modal-number-display img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      background-color: #ddd8d2;
      border-radius: 12px;
      padding: 6px;
    }

    /* 弹窗内积分显示（无"获得积分"文字） */
    .modal-reward-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 2rem;
      font-weight: 600;
      color: #6b8c7c;
      margin-bottom: 20px;
    }

    .modal-reward-value span {
      font-size: 2.2rem;
      line-height: 1;
    }

    .modal-btn {
      background: #c7d3cc;
      border: 1px solid #a8b9b0;
      border-radius: 40px;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 500;
      color: #2f4b3e;
      transition: all 0.15s;
      cursor: pointer;
      letter-spacing: 1px;
      width: 100%;
      box-shadow: none;
    }

    .modal-btn:active {
      background: #b7c9be;
      transform: scale(0.97);
    }

    /* ===== 彩蛋游戏界面 ===== */
    .egg-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
    }

    .egg-top-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
      background-color: #ddd8d2;
      border-radius: 16px;
      padding: 8px;
    }

    .egg-rows {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      width: 100%;
    }

    .egg-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .egg-heart {
      font-size: 2.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      user-select: none;
      display: inline-block;
      padding: 2px;
      border-radius: 8px;
    }

    .egg-heart:active {
      transform: scale(0.85);
    }

    .egg-heart.taken {
      opacity: 0.15;
      pointer-events: none;
      transform: scale(0.7);
    }

    .egg-heart.disabled {
      pointer-events: none;
    }

    .egg-bottom-text {
      text-align: center;
      font-size: 0.9rem;
      color: #9d8e82;
      letter-spacing: 0.5px;
      line-height: 1.5;
      padding: 0 8px;
    }

    /* 彩蛋弹窗 */
    .egg-modal-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #6b5a50;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .egg-modal-reward {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 2rem;
      font-weight: 600;
      color: #6b8c7c;
      margin-bottom: 20px;
    }

    .egg-modal-reward span {
      font-size: 2.2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- 积分栏 -->
    <div class="score-bar">
      <div class="score-left">
        <span class="score-label">历史最高</span>
        <div class="high-score">
          <span>🌱</span>
          <span id="highScoreDisplay">20</span>
        </div>
      </div>
      <div class="score-value">
        <span>🌱</span>
        <span id="scoreDisplay">20</span>
      </div>
    </div>

    <!-- 档位选择 -->
    <div id="tierSection" class="tier-section">
      <div class="tier-buttons">
        <button class="tier-btn" data-tier="1">-1<span class="emoji">🌱</span></button>
        <button class="tier-btn" data-tier="5">-5<span class="emoji">🌱</span></button>
        <button class="tier-btn" data-tier="10">-10<span class="emoji">🌱</span></button>
        <button class="tier-btn" data-tier="25">-25<span class="emoji">🌱</span></button>
        <button class="egg-btn" id="eggBtn">-1<span class="emoji">🌱</span>（彩蛋）</button>
      </div>
    </div>

    <!-- 游戏棋盘 -->
    <div id="boardSection" class="board-section hidden">
      <div id="board" class="board"></div>
      <div class="hint-text">翻出三个相同图案即可赢取对应🌱</div>
    </div>

    <!-- 彩蛋游戏界面 -->
    <div id="eggSection" class="egg-section hidden">
      <img class="egg-top-img" id="eggTopImg" src="" alt="彩蛋图案">
      <div class="egg-rows" id="eggRows"></div>
      <div class="egg-bottom-text">拿到最后一枚🖤即可赢取瞎子的肚兜</div>
    </div>

    <!-- 收集栏：12个png显示位（仅在开始界面显示，无文字） -->
    <div id="collectionSection" class="collection-section">
      <div class="collection-grid" id="collectionGrid"></div>
    </div>
  </div>

  <!-- 游戏结束弹窗 -->
  <div id="gameOverModal" class="modal-overlay hidden">
    <div class="modal-box">
      <!-- 显示翻出的三个相同数字/图案 -->
      <div class="modal-number-display" id="modalNumberDisplay"></div>
      <!-- 显示对应积分 -->
      <div class="modal-reward-value">
        <span>🌱</span>
        <span id="modalScoreValue">0</span>
      </div>
      <button class="modal-btn" id="modalCloseBtn">确定</button>
    </div>
  </div>

  <!-- 彩蛋弹窗 -->
  <div id="eggModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="egg-modal-text">天哪，那是接近的</div>
      <div class="egg-modal-reward">
        <span>🌱</span>
        <span>0</span>
      </div>
      <button class="modal-btn" id="eggModalCloseBtn">确定</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 积分映射表 ----------
      const REWARD_MAP = {
        1:  { 1: 0, 2: 0, 3: 1, 4: 2, 5: 4, 6: 8, 7: 25 },
        5:  { 1: 0, 2: 0, 3: 2, 4: 5, 5: 10, 6: 20, 7: 125 },
        10: { 1: 0, 2: 0, 3: 5, 4: 10, 5: 20, 6: 40, 7: 250 },
        25: { 1: 0, 2: 0, 3: 12, 4: 25, 5: 50, 6: 100, 7: 625 }
      };

      // 数字出现概率权重
      const WEIGHTS = [18, 17, 16, 15, 14, 12, 8];
      const WEIGHT_TOTAL = WEIGHTS.reduce((a, b) => a + b, 0);

      // 图片基础路径
      const IMG_BASE = 'https://raw.githubusercontent.com/12412175/gameTicket/main/images/';

      // 档位列表和数字5~7
      const TIERS = [1, 5, 10, 25];
      const HIGH_NUMS = [5, 6, 7];

      function getImgFileName(tier, num) {
        return `${tier}-${num}.png`;
      }

      // ---------- 预加载所有图片 ----------
      const preloadImages = [];
      TIERS.forEach(tier => {
        HIGH_NUMS.forEach(num => {
          const img = new Image();
          img.src = IMG_BASE + getImgFileName(tier, num);
          preloadImages.push(img);
        });
      });

      // 状态变量
      let currentScore = 20;
      let highScore = 20;
      let selectedTier = null;
      let boardCards = [];
      let cardElements = [];
      let cardState = [];
      let gameActive = false;
      let roundEnding = false;

      // 滑动翻卡相关
      let isPointerDown = false;
      let pointerStartIndex = -1;
      let lastFlippedIndex = -1;
      let swipeDirection = null;
      let swipeMoved = false;

      // 彩蛋游戏状态
      let eggRowsData = [3, 4, 7]; // 三行 🖤 的数量
      let eggGameActive = false;
      let eggPlayerTurn = true;    // 玩家先手
      let eggThinking = false;     // 防止系统连点

      // DOM 元素
      const scoreDisplay = document.getElementById('scoreDisplay');
      const highScoreDisplay = document.getElementById('highScoreDisplay');
      const tierSection = document.getElementById('tierSection');
      const boardSection = document.getElementById('boardSection');
      const boardEl = document.getElementById('board');
      const eggSection = document.getElementById('eggSection');
      const eggTopImg = document.getElementById('eggTopImg');
      const eggRowsEl = document.getElementById('eggRows');
      const hardResetBtn = document.getElementById('hardResetBtn');
      const tierButtons = document.querySelectorAll('.tier-btn');
      const collectionSection = document.getElementById('collectionSection');
      const collectionGrid = document.getElementById('collectionGrid');
      const gameOverModal = document.getElementById('gameOverModal');
      const modalNumberDisplay = document.getElementById('modalNumberDisplay');
      const modalScoreValue = document.getElementById('modalScoreValue');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      const eggBtn = document.getElementById('eggBtn');
      const eggModal = document.getElementById('eggModal');
      const eggModalCloseBtn = document.getElementById('eggModalCloseBtn');

      // 初始化收集栏（无文字，只显示图片）
      function initCollectionGrid() {
        collectionGrid.innerHTML = '';
        TIERS.forEach(tier => {
          HIGH_NUMS.forEach(num => {
            const slot = document.createElement('div');
            slot.className = 'collection-slot';
            slot.dataset.tier = tier;
            slot.dataset.num = num;
            const img = document.createElement('img');
            img.src = IMG_BASE + getImgFileName(tier, num);
            img.alt = `${tier}-${num}`;
            slot.appendChild(img);
            collectionGrid.appendChild(slot);
          });
        });
      }

      // 解锁png槽位
      function unlockPngSlot(tier, num) {
        const slot = collectionGrid.querySelector(`.collection-slot[data-tier="${tier}"][data-num="${num}"]`);
        if (slot) {
          slot.classList.add('unlocked');
        }
      }

      // 更新积分UI
      function updateScoreUI() {
        scoreDisplay.textContent = currentScore;
        if (currentScore > highScore) {
          highScore = currentScore;
        }
        highScoreDisplay.textContent = highScore;
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function weightedRandomNumber() {
        let r = Math.random() * WEIGHT_TOTAL;
        let cumulative = 0;
        for (let i = 0; i < WEIGHTS.length; i++) {
          cumulative += WEIGHTS[i];
          if (r < cumulative) return i + 1;
        }
        return 7;
      }

      function generateDeck() {
        const deck = [];
        for (let i = 0; i < 20; i++) {
          deck.push(weightedRandomNumber());
        }
        const countMap = {};
        deck.forEach(num => { countMap[num] = (countMap[num] || 0) + 1; });
        const hasTriple = Object.values(countMap).some(c => c >= 3);
        if (!hasTriple) {
          const forcedNum = weightedRandomNumber();
          deck[0] = forcedNum;
          deck[1] = forcedNum;
          deck[2] = forcedNum;
        }
        return shuffleArray(deck);
      }

      // 重置到开始界面
      function resetToStart() {
        updateScoreUI();
        selectedTier = null;
        tierButtons.forEach(btn => btn.classList.remove('selected'));
        boardSection.classList.add('hidden');
        eggSection.classList.add('hidden');
        tierSection.classList.remove('hidden');
        collectionSection.classList.remove('hidden');
        boardEl.innerHTML = '';
        cardElements = [];
        cardState = [];
        boardCards = [];
        gameActive = false;
        roundEnding = false;
        isPointerDown = false;
        pointerStartIndex = -1;
        lastFlippedIndex = -1;
        swipeDirection = null;
        swipeMoved = false;
        eggGameActive = false;
        eggPlayerTurn = true;
        eggThinking = false;
      }

      // 重开：重置所有状态到初始（历史最高和收集栏位清零）
      function hardReset() {
        currentScore = 20;
        highScore = 20;
        updateScoreUI();
        selectedTier = null;
        tierButtons.forEach(btn => btn.classList.remove('selected'));
        boardSection.classList.add('hidden');
        eggSection.classList.add('hidden');
        tierSection.classList.remove('hidden');
        collectionSection.classList.remove('hidden');
        boardEl.innerHTML = '';
        cardElements = [];
        cardState = [];
        boardCards = [];
        gameActive = false;
        roundEnding = false;
        isPointerDown = false;
        pointerStartIndex = -1;
        lastFlippedIndex = -1;
        swipeDirection = null;
        swipeMoved = false;
        eggGameActive = false;
        eggPlayerTurn = true;
        eggThinking = false;
        document.querySelectorAll('.collection-slot').forEach(slot => {
          slot.classList.remove('unlocked');
        });
      }

      // 开始游戏
      function startGame(tier) {
        if (currentScore < tier) {
          alert('积分不足');
          return;
        }
        currentScore -= tier;
        updateScoreUI();

        selectedTier = tier;
        boardCards = generateDeck();
        cardState = new Array(20).fill('hidden');
        gameActive = true;
        roundEnding = false;

        renderBoard();
        tierSection.classList.add('hidden');
        eggSection.classList.add('hidden');
        boardSection.classList.remove('hidden');
        collectionSection.classList.add('hidden');

        isPointerDown = false;
        pointerStartIndex = -1;
        lastFlippedIndex = -1;
        swipeDirection = null;
        swipeMoved = false;
      }

      // 渲染卡片
      function renderBoard() {
        boardEl.innerHTML = '';
        cardElements = [];
        for (let i = 0; i < 20; i++) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.index = i;
          card.addEventListener('click', () => onCardClick(i));
          boardEl.appendChild(card);
          cardElements.push(card);
        }
        bindSwipeEvents();
      }

      // 绑定滑动事件
      function bindSwipeEvents() {
        boardEl.addEventListener('pointerdown', handlePointerDown);
        boardEl.addEventListener('pointermove', handlePointerMove);
        boardEl.addEventListener('pointerup', handlePointerUp);
        boardEl.addEventListener('pointercancel', handlePointerUp);
        boardEl.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
      }

      function getCardIndexFromPoint(x, y) {
        const rect = boardEl.getBoundingClientRect();
        const relX = x - rect.left;
        const relY = y - rect.top;
        if (relX < 0 || relY < 0 || relX > rect.width || relY > rect.height) return -1;
        const cols = 4;
        const rows = 5;
        const gap = 8;
        const cardW = (rect.width - gap * (cols - 1)) / cols;
        const cardH = (rect.height - gap * (rows - 1)) / rows;
        const col = Math.floor(relX / (cardW + gap));
        const row = Math.floor(relY / (cardH + gap));
        if (col < 0 || col >= cols || row < 0 || row >= rows) return -1;
        return row * cols + col;
      }

      function handlePointerDown(e) {
        if (!gameActive || roundEnding) return;
        const idx = getCardIndexFromPoint(e.clientX, e.clientY);
        if (idx === -1) return;
        if (cardState[idx] === 'matched' || cardState[idx] === 'flipped') return;
        isPointerDown = true;
        pointerStartIndex = idx;
        lastFlippedIndex = idx;
        swipeDirection = null;
        swipeMoved = false;
        flipCard(idx);
        e.preventDefault();
      }

      function handlePointerMove(e) {
        if (!isPointerDown || !gameActive || roundEnding) return;
        e.preventDefault();
        const idx = getCardIndexFromPoint(e.clientX, e.clientY);
        if (idx === -1 || idx === lastFlippedIndex) return;

        if (swipeDirection === null && pointerStartIndex !== -1) {
          const cols = 4;
          const startRow = Math.floor(pointerStartIndex / cols);
          const startCol = pointerStartIndex % cols;
          const currRow = Math.floor(idx / cols);
          const currCol = idx % cols;
          const dRow = currRow - startRow;
          const dCol = currCol - startCol;
          if (Math.abs(dRow) > Math.abs(dCol)) {
            swipeDirection = dRow > 0 ? 'down' : 'up';
          } else if (Math.abs(dCol) > Math.abs(dRow)) {
            swipeDirection = dCol > 0 ? 'right' : 'left';
          } else {
            return;
          }
        }

        if (swipeDirection) {
          const cols = 4;
          const lastRow = Math.floor(lastFlippedIndex / cols);
          const lastCol = lastFlippedIndex % cols;
          const currRow = Math.floor(idx / cols);
          const currCol = idx % cols;
          let validStep = false;
          if (swipeDirection === 'right' && currRow === lastRow && currCol === lastCol + 1) validStep = true;
          if (swipeDirection === 'left' && currRow === lastRow && currCol === lastCol - 1) validStep = true;
          if (swipeDirection === 'down' && currCol === lastCol && currRow === lastRow + 1) validStep = true;
          if (swipeDirection === 'up' && currCol === lastCol && currRow === lastRow - 1) validStep = true;
          if (validStep && cardState[idx] === 'hidden') {
            flipCard(idx);
            lastFlippedIndex = idx;
            swipeMoved = true;
          }
        }
      }

      function handlePointerUp() {
        isPointerDown = false;
        pointerStartIndex = -1;
        lastFlippedIndex = -1;
        swipeDirection = null;
        swipeMoved = false;
      }

      // 翻开一张卡片
      function flipCard(index) {
        if (cardState[index] !== 'hidden') return;
        if (!gameActive || roundEnding) return;

        const card = cardElements[index];
        const num = boardCards[index];
        const points = REWARD_MAP[selectedTier]?.[num] ?? 0;

        card.innerHTML = '';
        card.classList.add('flipped');
        cardState[index] = 'flipped';

        if (num >= 5 && num <= 7) {
          const img = document.createElement('img');
          img.className = 'card-img';
          img.src = IMG_BASE + getImgFileName(selectedTier, num);
          img.alt = String(num);
          card.appendChild(img);
          const pointsSpan = document.createElement('span');
          pointsSpan.className = 'img-points';
          pointsSpan.textContent = `+${points}🌱`;
          card.appendChild(pointsSpan);
        } else {
          const numSpan = document.createElement('span');
          numSpan.className = 'number';
          numSpan.textContent = num;
          card.appendChild(numSpan);
          const pointsSpan = document.createElement('span');
          pointsSpan.className = 'points';
          pointsSpan.textContent = `+${points}🌱`;
          card.appendChild(pointsSpan);
        }

        checkTriple(num);
      }

      // 检查是否集齐三张相同数字
      function checkTriple(num) {
        const count = cardState.reduce((acc, state, i) => {
          if ((state === 'flipped' || state === 'matched') && boardCards[i] === num) return acc + 1;
          return acc;
        }, 0);

        if (count >= 3) {
          roundEnding = true;
          gameActive = false;
          isPointerDown = false;

          for (let i = 0; i < 20; i++) {
            if (boardCards[i] === num && (cardState[i] === 'flipped' || cardState[i] === 'matched')) {
              cardState[i] = 'matched';
              cardElements[i].classList.add('matched');
            }
          }

          const reward = REWARD_MAP[selectedTier]?.[num] ?? 0;
          if (reward > 0) {
            currentScore += reward;
            updateScoreUI();
            scoreDisplay.parentElement.style.transform = 'scale(1.15)';
            setTimeout(() => {
              scoreDisplay.parentElement.style.transform = 'scale(1)';
            }, 200);
          }

          if (num >= 5 && num <= 7) {
            unlockPngSlot(selectedTier, num);
          }

          setTimeout(() => {
            showGameOverModal(num, reward);
          }, 600);
        }
      }

      function onCardClick(index) {
        if (!gameActive || roundEnding) return;
        if (cardState[index] === 'matched') return;
        if (cardState[index] === 'flipped') return;
        if (cardState[index] !== 'hidden') return;
        flipCard(index);
      }

      // 显示弹窗
      function showGameOverModal(num, reward) {
        modalNumberDisplay.innerHTML = '';
        for (let k = 0; k < 3; k++) {
          if (num >= 5 && num <= 7) {
            const img = document.createElement('img');
            img.src = IMG_BASE + getImgFileName(selectedTier, num);
            img.alt = String(num);
            modalNumberDisplay.appendChild(img);
          } else {
            const span = document.createElement('span');
            span.className = 'num-text';
            span.textContent = num;
            modalNumberDisplay.appendChild(span);
          }
        }
        modalScoreValue.textContent = reward;
        gameOverModal.classList.remove('hidden');
      }

      // 关闭翻牌弹窗回到开始界面
      function closeModalAndReset() {
        gameOverModal.classList.add('hidden');
        resetToStart();
      }

      // ===================== 彩蛋游戏逻辑 =====================

      // 开始彩蛋游戏
      function startEggGame() {
        if (currentScore < 1) {
          alert('积分不足');
          return;
        }
        currentScore -= 1;
        updateScoreUI();

        eggRowsData = [3, 4, 7];
        eggGameActive = true;
        eggPlayerTurn = true;
        eggThinking = false;

        tierSection.classList.add('hidden');
        collectionSection.classList.add('hidden');
        boardSection.classList.add('hidden');
        eggSection.classList.remove('hidden');

        eggTopImg.src = IMG_BASE + '25-5.png';
        eggTopImg.alt = '彩蛋图案';

        renderEggRows();
      }

      // 渲染彩蛋行
      function renderEggRows() {
        eggRowsEl.innerHTML = '';
        eggRowsData.forEach((count, rowIdx) => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'egg-row';
          rowDiv.dataset.row = rowIdx;
          for (let i = 0; i < count; i++) {
            const heart = document.createElement('span');
            heart.className = 'egg-heart';
            heart.textContent = '🖤';
            heart.dataset.row = rowIdx;
            heart.dataset.idx = i;
            heart.addEventListener('click', () => onEggHeartClick(rowIdx, i));
            rowDiv.appendChild(heart);
          }
          eggRowsEl.appendChild(rowDiv);
        });
      }

      // 玩家点击 🖤
      function onEggHeartClick(rowIdx, heartIdx) {
        if (!eggGameActive || !eggPlayerTurn || eggThinking) return;
        if (eggRowsData[rowIdx] <= 0) return;

        // 玩家从该行拿走从 heartIdx 开始到该行末尾的所有🖤（简化：点哪个就拿走该行从该位置到最后的所有🖤）
        // 但规则是"每次只能从同一行中拿，数量不限，但至少要取一枚"
        // 更自然的交互：点击某行的某个🖤，表示从该行拿走这一枚及之后的所有🖤
        // 为了简化并符合"数量不限"的规则，我们让玩家点击该行任意一个🖤，拿走从该位置到该行末尾的所有🖤
        // 这样玩家可以通过点击不同的位置来选择拿几枚

        const takeCount = eggRowsData[rowIdx] - heartIdx;
        if (takeCount <= 0) return;

        // 执行玩家拿取
        eggRowsData[rowIdx] -= takeCount;
        renderEggRows();

        // 检查游戏是否结束
        if (checkEggGameOver()) return;

        // 切换为系统回合
        eggPlayerTurn = false;
        eggThinking = true;
        setTimeout(() => {
          systemEggMove();
        }, 400);
      }

      // 系统后手必胜策略（Nim 游戏）
      function systemEggMove() {
        if (!eggGameActive) return;

        // 计算 Nim 和（异或）
        const xorSum = eggRowsData.reduce((a, b) => a ^ b, 0);

        if (xorSum === 0) {
          // 必败局面，随便拿一枚（最优策略下已无法避免失败，但系统仍按规则拿）
          for (let r = 0; r < eggRowsData.length; r++) {
            if (eggRowsData[r] > 0) {
              eggRowsData[r] -= 1;
              break;
            }
          }
        } else {
          // 必胜策略：找到一行，使其变为 eggRowsData[r] ^ xorSum
          for (let r = 0; r < eggRowsData.length; r++) {
            const target = eggRowsData[r] ^ xorSum;
            if (target < eggRowsData[r]) {
              eggRowsData[r] = target;
              break;
            }
          }
        }

        renderEggRows();

        if (checkEggGameOver()) return;

        // 切换回玩家回合
        eggPlayerTurn = true;
        eggThinking = false;
      }

      // 检查彩蛋游戏是否结束
      function checkEggGameOver() {
        const total = eggRowsData.reduce((a, b) => a + b, 0);
        if (total === 0) {
          eggGameActive = false;
          eggThinking = false;
          // 系统拿到最后一枚（因为系统后手必胜），弹出弹窗
          setTimeout(() => {
            eggModal.classList.remove('hidden');
          }, 500);
          return true;
        }
        return false;
      }

      // 关闭彩蛋弹窗，回到开始界面
      function closeEggModal() {
        eggModal.classList.add('hidden');
        resetToStart();
      }

      // ===================== 事件绑定 =====================

      // 档位按钮事件
      tierButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const tier = parseInt(btn.dataset.tier, 10);
          if (currentScore < tier) {
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = '', 150);
            return;
          }
          if (!tierSection.classList.contains('hidden')) {
            tierButtons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            startGame(tier);
          }
        });
      });

      // 彩蛋按钮
      eggBtn.addEventListener('click', () => {
        if (currentScore < 1) {
          eggBtn.style.transform = 'scale(0.95)';
          setTimeout(() => eggBtn.style.transform = '', 150);
          return;
        }
        startEggGame();
      });

      // 弹窗按钮
      modalCloseBtn.addEventListener('click', closeModalAndReset);
      eggModalCloseBtn.addEventListener('click', closeEggModal);

      // 初始化
      initCollectionGrid();
      updateScoreUI();
    })();
  </script>
</body>
